name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.2'
          cache: true

      # The podman-backed tests need a working rootless container stack,
      # not just a podman binary. Install the pieces rather than relying
      # on the runner image to carry them, so an image that stops doing
      # so breaks this step instead of reading as a test failure.
      - name: container runtime deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends slirp4netns crun

      # When the container tests fail, the first question is whether the
      # stack under them is sane. Answer it from the log.
      - name: container runtime versions
        run: |
          podman version
          crun --version
          slirp4netns --version

      - name: make check
        run: make check
