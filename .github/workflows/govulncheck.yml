name: govulncheck

# Dependabot and govulncheck disagree: Dependabot's version updates skip
# indirect requirements, and its security updates only know advisories that
# reached GitHub's database. This scans main against the Go vulnerability
# database, bumps every module with a *called* finding to its fixed version,
# and opens one PR for the lot.

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govulncheck
  cancel-in-progress: false

env:
  # Keep GO_VERSION in step with release.yml: the binaries ship with this
  # toolchain, so a called stdlib finding is a vulnerable release.
  GO_VERSION: '1.26.x'
  STDLIB_FAILS: 'true'
  BRANCH: govulncheck/fixes

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # A PR opened with the workflow token has its pull_request runs held for
      # a maintainer's approval, so its required check never runs. Pushing and
      # opening it as a GitHub App starts them like any other PR's.
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app.outputs.token }}

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: scan and fix
        run: |
          set -euo pipefail
          called='[.[] | .finding? // empty | select(.trace[0].function != null)]'

          govulncheck -format json ./... > before.json

          # Highest fixed version per non-stdlib module, with what it clears.
          jq -rs "$called"' | map(select(.trace[0].module != "stdlib" and (.fixed_version // "") != ""))
            | group_by(.trace[0].module)
            | .[] | "\(.[0].trace[0].module) \(map(.fixed_version) | unique | join(" ")) \(map(.osv) | unique | join(","))"' before.json |
          while read -r mod versions ids; do
            top=$(printf '%s\n' $versions | sort -V | tail -1)
            echo "$mod@$top $ids"
          done > fixes.txt

          while read -r spec _; do go get "$spec"; done < fixes.txt
          go mod tidy

          govulncheck -format json ./... > after.json
          jq -rs "$called"' | map("\(.osv) \(.trace[0].module)@\(.trace[0].version) fixed:\(.fixed_version // "none")") | unique | .[]' after.json > remaining.txt

      - name: open the fix PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -euo pipefail
          if [ ! -s fixes.txt ] || git diff --quiet -- go.mod go.sum; then
            # Nothing left to bump — main was fixed another way, usually by
            # Dependabot getting there first — so an open fix PR is stale.
            if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = OPEN ]; then
              gh pr close "$BRANCH" --delete-branch \
                --comment 'main no longer has a called vulnerability these bumps would fix.'
            fi
            exit 0
          fi
          {
            echo 'Bumps each module with a called vulnerability to its fixed version:'
            echo
            while read -r spec ids; do echo "- \`$spec\` — $ids"; done < fixes.txt
          } > body.md
          bot="$APP_SLUG[bot]"
          git config user.name "$bot"
          git config user.email "$(gh api "users/$bot" -q .id)+$bot@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -q -a -m 'deps: bump modules with called vulnerabilities' -m "$(cat body.md)"
          git push -q -f origin "$BRANCH"
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" != OPEN ]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'deps: bump modules with called vulnerabilities' --body-file body.md
          else
            gh pr edit "$BRANCH" --body-file body.md
          fi

      - name: report
        if: always()
        run: |
          set -euo pipefail
          touch fixes.txt remaining.txt
          {
            echo '## govulncheck'
            if [ -s fixes.txt ]; then echo '### Fixed in the PR'; sed 's/^/- /' fixes.txt; fi
            if [ -s remaining.txt ]; then echo '### Still called'; sed 's/^/- /' remaining.txt; fi
            if [ ! -s fixes.txt ] && [ ! -s remaining.txt ]; then echo 'No called vulnerabilities.'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          # A finding the bumps could not clear needs a person. stdlib counts
          # only where this repo ships binaries built with GO_VERSION.
          grep -v ' stdlib@' remaining.txt > blocking.txt || true
          if [ "$STDLIB_FAILS" = true ]; then cp remaining.txt blocking.txt; fi
          if [ -s blocking.txt ]; then
            echo "::error::called vulnerabilities with no automatic fix:"; cat blocking.txt; exit 1
          fi
